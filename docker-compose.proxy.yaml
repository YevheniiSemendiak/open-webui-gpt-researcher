services:
  vpn-proxy:
    build:
      context: .
      dockerfile: Dockerfile.openvpn-proxy
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      OPENVPN_CONFIG_FILE: /vpn/${OPENVPN_CONFIG_NAME:-client.ovpn}
      OPENVPN_AUTH_FILE: /run/secrets/openvpn-auth
      VPN_BYPASS_CIDRS: ${VPN_BYPASS_CIDRS:-}
    volumes:
      - type: bind
        source: ${OPENVPN_CONFIG_DIR:?set OPENVPN_CONFIG_DIR to the OpenVPN configuration directory}
        target: /vpn
        read_only: true
    secrets:
      - openvpn-auth
    healthcheck:
      test: ["CMD", "/usr/local/bin/openvpn-proxy-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  searxng:
    depends_on:
      vpn-proxy:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${SEARXNG_SETTINGS_FILE:-./dev/searxng/settings.local.yml}
        target: /etc/searxng/settings.yml
        read_only: true

  open-webui:
    depends_on:
      vpn-proxy:
        condition: service_healthy
    environment:
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: http://searxng:8080/search
      SEARXNG_LANGUAGE: all
      WEB_SEARCH_RESULT_COUNT: ${WEB_SEARCH_RESULT_COUNT:-5}
      WEB_SEARCH_CONCURRENT_REQUESTS: ${WEB_SEARCH_CONCURRENT_REQUESTS:-2}
      WEB_SEARCH_TRUST_ENV: "true"
      WEB_LOADER_ENGINE: safe_web
      BYPASS_WEB_SEARCH_WEB_LOADER: "false"
      BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL: "false"
      HTTP_PROXY: http://vpn-proxy:8118
      HTTPS_PROXY: http://vpn-proxy:8118
      NO_PROXY: localhost,127.0.0.1,postgres,minio,searxng,api,vpn-proxy,open-webui

  api:
    depends_on:
      vpn-proxy:
        condition: service_healthy
    environment:
      CRAWLER_PROXY_URL: socks5://vpn-proxy:1080

secrets:
  openvpn-auth:
    file: ${OPENVPN_AUTH_FILE:?set OPENVPN_AUTH_FILE to an OpenVPN username/password file}
