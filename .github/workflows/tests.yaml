name: Tests

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run ruff check src tests openwebui_functions dev
      - run: uv run ruff format --check src tests openwebui_functions dev
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build

  helm:
    name: Helm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - run: helm lint chart/open-webui-gpt-researcher
      - run: helm template test chart/open-webui-gpt-researcher >/dev/null
      - run: helm template test chart/open-webui-gpt-researcher --set searxng.enabled=true >/dev/null

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.firecrawl.yaml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.proxy.yaml config --quiet
        env:
          OPENVPN_CONFIG_DIR: /tmp/openvpn
          OPENVPN_AUTH_FILE: /tmp/openvpn-auth

  image:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.openvpn-proxy
          push: false
          cache-from: type=gha,scope=openvpn-proxy
          cache-to: type=gha,mode=max,scope=openvpn-proxy

  check:
    name: Check
    needs:
      - python
      - helm
      - compose
      - image
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
