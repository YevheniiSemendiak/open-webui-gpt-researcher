{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "research.fullname" . }}
  labels:
    {{- include "research.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "research.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- if or .Values.api.enabled .Values.searxng.enabled }}
    - from:
        - podSelector: {}
      ports:
        {{- if .Values.api.enabled }}
        - protocol: TCP
          port: {{ .Values.api.service.port }}
        {{- end }}
        {{- if .Values.searxng.enabled }}
        - protocol: TCP
          port: {{ .Values.searxng.service.port }}
        {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.additionalIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
