{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "research.fullname" . }}
  labels:
    {{- include "research.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ required "secrets.databaseUrl is required when secrets.create=true" .Values.secrets.databaseUrl | quote }}
  service-token: {{ required "secrets.serviceToken is required when secrets.create=true" .Values.secrets.serviceToken | quote }}
  signing-secret: {{ required "secrets.signingSecret is required when secrets.create=true" .Values.secrets.signingSecret | quote }}
  openwebui-api-key: {{ required "secrets.openwebuiApiKey is required when secrets.create=true" .Values.secrets.openwebuiApiKey | quote }}
  s3-access-key-id: {{ .Values.secrets.s3AccessKeyId | quote }}
  s3-secret-access-key: {{ .Values.secrets.s3SecretAccessKey | quote }}
{{- end }}
