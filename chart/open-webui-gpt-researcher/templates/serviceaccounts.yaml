{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "research.controllerServiceAccount" . }}
  labels:
    {{- include "research.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "research.runnerServiceAccount" . }}
  labels:
    {{- include "research.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
