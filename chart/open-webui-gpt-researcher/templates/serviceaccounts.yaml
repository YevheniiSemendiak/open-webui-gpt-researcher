{{- if and .Values.api.serviceAccount.create (or .Values.api.enabled .Values.migration.enabled .Values.cleanup.enabled) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "research.apiServiceAccount" . }}
  labels:
    {{- include "research.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.researchJob.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "research.researchJobServiceAccount" . }}
  labels:
    {{- include "research.labels" . | nindent 4 }}
    app.kubernetes.io/component: research-job
  {{- with .Values.researchJob.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
