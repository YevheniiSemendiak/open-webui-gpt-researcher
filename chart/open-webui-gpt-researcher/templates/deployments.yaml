apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "research.fullname" . }}-api
  labels:
    {{- include "research.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "research.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "research.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "research.controllerServiceAccount" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: api
          image: {{ include "research.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["api"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "research.fullname" . }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "research.databaseSecretName" . }}
                  key: {{ .Values.database.secretKey }}
            - name: INTERNAL_BASE_URL
              value: {{ printf "http://%s:%v" (include "research.fullname" .) .Values.service.port | quote }}
            - name: RUNNER_IMAGE
              value: {{ include "research.image" . | quote }}
            - name: RUNNER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUNNER_OWNER_DEPLOYMENT
              value: {{ printf "%s-controller" (include "research.fullname" .) | quote }}
            - name: RUNNER_SERVICE_ACCOUNT
              value: {{ include "research.runnerServiceAccount" . | quote }}
            - name: RUNNER_ACTIVE_DEADLINE_SECONDS
              value: {{ .Values.runner.activeDeadlineSeconds | quote }}
            - name: RUNNER_TTL_SECONDS_AFTER_FINISHED
              value: {{ .Values.runner.ttlSecondsAfterFinished | quote }}
            - name: RUNNER_CPU_REQUEST
              value: {{ .Values.runner.resources.requests.cpu | quote }}
            - name: RUNNER_MEMORY_REQUEST
              value: {{ .Values.runner.resources.requests.memory | quote }}
            - name: RUNNER_CPU_LIMIT
              value: {{ .Values.runner.resources.limits.cpu | quote }}
            - name: RUNNER_MEMORY_LIMIT
              value: {{ .Values.runner.resources.limits.memory | quote }}
            {{- if .Values.runner.extraEnvSecret }}
            - name: RUNNER_EXTRA_ENV_SECRET
              value: {{ .Values.runner.extraEnvSecret | quote }}
            {{- end }}
            {{- include "research.apiSecretEnv" . | nindent 12 }}
            {{- include "research.artifactSecretEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
          livenessProbe:
            httpGet: {path: /health/live, port: http}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: artifacts, mountPath: /data/artifacts}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: artifacts
          emptyDir: {}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "research.fullname" . }}-controller
  labels:
    {{- include "research.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "research.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "research.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "research.controllerServiceAccount" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: controller
