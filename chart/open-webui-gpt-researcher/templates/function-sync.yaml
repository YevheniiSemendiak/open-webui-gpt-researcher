{{- if and .Values.api.enabled .Values.functionSync.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "research.fullname" . }}-function-sync
  labels:
    {{- include "research.labels" . | nindent 4 }}
    app.kubernetes.io/component: function-sync
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "10"
spec:
  backoffLimit: {{ .Values.functionSync.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.functionSync.ttlSecondsAfterFinished }}
  template:
    metadata:
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "research.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: function-sync
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "research.apiServiceAccount" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      imagePullSecrets:
        {{- toYaml .Values.api.imagePullSecrets | nindent 8 }}
      containers:
        - name: sync-functions
          image: {{ printf "%s:%s" .Values.api.image.repository (.Values.api.image.tag | default .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          args: ["sync-functions"]
          securityContext:
            {{- toYaml .Values.api.containerSecurityContext | nindent 12 }}
          env:
            {{- range $name, $value := .Values.api.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            - name: INTERNAL_BASE_URL
              value: {{ printf "http://%s.%s.svc:%v" (include "research.fullname" .) .Release.Namespace .Values.api.service.port | quote }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.functionSync.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.api.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.functionSync.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: artifacts, mountPath: /data/artifacts}
            {{- with .Values.api.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: artifacts
          emptyDir: {}
        {{- with .Values.api.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      nodeSelector:
        {{- toYaml .Values.api.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.api.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.api.affinity | nindent 8 }}
{{- end }}
