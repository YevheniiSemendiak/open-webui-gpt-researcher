{{- if .Values.cleanup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "research.fullname" . }}-cleanup
  labels:
    {{- include "research.labels" . | nindent 4 }}
    app.kubernetes.io/component: cleanup
spec:
  schedule: {{ .Values.cleanup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.cleanup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cleanup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.cleanup.backoffLimit }}
      ttlSecondsAfterFinished: {{ .Values.cleanup.ttlSecondsAfterFinished }}
      template:
        metadata:
          {{- with .Values.api.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          labels:
            {{- include "research.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: cleanup
            {{- with .Values.api.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "research.apiServiceAccount" . }}
          automountServiceAccountToken: false
          securityContext:
            {{- toYaml .Values.api.podSecurityContext | nindent 12 }}
          imagePullSecrets:
            {{- toYaml .Values.api.imagePullSecrets | nindent 12 }}
          containers:
            - name: cleanup
              image: {{ printf "%s:%s" .Values.api.image.repository .Values.api.image.tag }}
              imagePullPolicy: {{ .Values.api.image.pullPolicy }}
              args: ["cleanup"]
              securityContext:
                {{- toYaml .Values.api.containerSecurityContext | nindent 16 }}
              env:
                {{- range $name, $value := .Values.api.env }}
                - name: {{ $name }}
                  value: {{ $value | quote }}
                {{- end }}
                - name: INTERNAL_BASE_URL
                  value: {{ printf "http://%s:%v" (include "research.fullname" .) .Values.api.service.port | quote }}
              {{- with .Values.api.envFrom }}
              envFrom:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              resources:
                {{- toYaml .Values.cleanup.resources | nindent 16 }}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
                - {name: artifacts, mountPath: /data/artifacts}
                {{- with .Values.api.extraVolumeMounts }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
          volumes:
            - name: tmp
              emptyDir: {}
            - name: artifacts
              emptyDir: {}
            {{- with .Values.api.extraVolumes }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          nodeSelector:
            {{- toYaml .Values.api.nodeSelector | nindent 12 }}
          tolerations:
            {{- toYaml .Values.api.tolerations | nindent 12 }}
          affinity:
            {{- toYaml .Values.api.affinity | nindent 12 }}
{{- end }}
