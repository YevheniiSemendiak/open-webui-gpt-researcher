apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "research.fullname" . }}-controller
  labels:
    {{- include "research.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ printf "%s-controller" (include "research.fullname" .) | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "research.fullname" . }}-controller
  labels:
    {{- include "research.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "research.fullname" . }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "research.controllerServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
