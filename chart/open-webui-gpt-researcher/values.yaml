replicaCount: 2

image:
  repository: ghcr.io/example/open-webui-gpt-researcher
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  controllerName: ""
  runnerName: ""

service:
  type: ClusterIP
  port: 8090

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: research.example.com
  path: /v1/research-jobs
  pathType: Prefix
  tls: []

env:
  ENVIRONMENT: production
  # Optional browser-reachable base URL used only for signed artifact download links.
  # The API and runners continue to use the ClusterIP Service when this is empty.
  ARTIFACT_BASE_URL: ""
  OPENWEBUI_URL: http://open-webui.open-webui.svc.cluster.local:8080
  OPENWEBUI_TIMEOUT_SECONDS: 600
  ARTIFACT_BACKEND: s3
  ARTIFACT_PATH: /data/artifacts
  S3_ENDPOINT_URL: https://s3.example.com
  S3_REGION: us-east-1
  S3_BUCKET: research-artifacts
  MODE: k8s
  PUBLIC_SEARCH_ENABLED: true
  # SearXNG is deployed separately; NoDriver runs headlessly inside each runner.
  RETRIEVER: searx
  SCRAPER: nodriver
  SEARX_URL: http://searxng.searxng.svc.cluster.local:8080
  MODEL_ROUTE: openwebui
  # Suggestions only. Users choose accessible models for every research run.
  DEFAULT_MODEL_PROFILES:
    default:
      fast: gpt-4.1-mini
      smart: gpt-4.1
      strategic: gpt-4.1
  DEFAULT_RESEARCH_STRATEGY: balanced
  MODEL_CONTEXT_SAFETY_TOKENS: 256
  REASONING_EFFORT: ""
  EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
  MAX_CONCURRENT_JOBS: 5
  # Quoted to preserve all 64 bits through YAML/Helm parsing.
  CONTROLLER_LEADER_LOCK_ID: "7305809465149768307"
  CONTROLLER_LEADER_RETRY_SECONDS: 5
  DISPATCH_LEASE_SECONDS: 120
  DISPATCH_RECONCILE_BATCH_SIZE: 100
  RUNNER_HEARTBEAT_SECONDS: 10
  RUNNER_STALE_SECONDS: 60
  RUNNER_MAX_ATTEMPTS: 2
  HARD_MAX_INPUT_TOKENS: 300000
  HARD_MAX_OUTPUT_TOKENS: 64000
  HARD_MAX_QUERIES: 100
  HARD_MAX_WALL_TIME_SECONDS: 7200
  EVENT_RETENTION_DAYS: 30
  ARTIFACT_RETENTION_DAYS: 90
  JOB_RETENTION_DAYS: 90
  ORPHAN_GRACE_SECONDS: 86400
  CLEANUP_BATCH_SIZE: 100

runner:
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 3600
  extraEnvSecret: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

database:
  # Defaults to secrets.existingSecret (or the chart-created Secret) when empty.
  existingSecret: ""
  secretKey: database-url

secrets:
  existingSecret: ""
  create: false
  databaseUrl: ""
  serviceToken: ""
  signingSecret: ""
  openwebuiApiKey: ""
  s3AccessKeyId: ""
  s3SecretAccessKey: ""

api:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

controller:
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

functionSync:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

cleanup:
  enabled: true
  schedule: "17 * * * *"
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  runAsNonRoot: true
  runAsUser: 10001

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  enabled: true
  additionalIngress: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1
