replicaCount: 2

image:
  repository: ghcr.io/example/open-webui-gpt-researcher
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  controllerName: ""
  runnerName: ""

service:
  type: ClusterIP
  port: 8090

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: research.example.com
  path: /v1/research-jobs
  pathType: Prefix
  tls: []

config:
  environment: production
  # Optional browser-reachable base URL used only for signed artifact download links.
  # The API and runners continue to use the ClusterIP Service when this is empty.
  artifactBaseUrl: ""
  openwebuiUrl: http://open-webui.open-webui.svc.cluster.local:8080
  artifactBackend: s3
  artifactPath: /data/artifacts
  s3EndpointUrl: https://s3.example.com
  s3Region: us-east-1
  s3Bucket: research-artifacts
  mode: k8s
  publicSearchEnabled: true
  modelRoute: openwebui
  modelProfiles:
    default: gpt-4.1-mini
  embeddingModel: sentence-transformers/all-MiniLM-L6-v2
  maxConcurrentJobs: 5
  # Quoted to preserve all 64 bits through YAML/Helm parsing.
  controllerLeaderLockId: "7305809465149768307"
  controllerLeaderRetrySeconds: 5
  dispatchLeaseSeconds: 120
  dispatchReconcileBatchSize: 100
  hardMaxInputTokens: 300000
  hardMaxOutputTokens: 64000
  hardMaxSearches: 100
  hardMaxWallTimeSeconds: 7200
  eventRetentionDays: 30
  artifactRetentionDays: 90
  jobRetentionDays: 90
  orphanGraceSeconds: 86400
  cleanupBatchSize: 100
  runner:
    activeDeadlineSeconds: 7200
    ttlSecondsAfterFinished: 3600
    extraEnvSecret: ""
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi

database:
  # Defaults to secrets.existingSecret (or the chart-created Secret) when empty.
  existingSecret: ""
  secretKey: database-url

secrets:
  existingSecret: ""
  create: false
  databaseUrl: ""
  serviceToken: ""
  signingSecret: ""
  openwebuiApiKey: ""
  s3AccessKeyId: ""
  s3SecretAccessKey: ""

api:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

controller:
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

functionSync:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

cleanup:
  enabled: true
  schedule: "17 * * * *"
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  runAsNonRoot: true
  runAsUser: 10001

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  enabled: true
  additionalIngress: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1
